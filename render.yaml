# Render Blueprint: Render dashboard > New > Blueprint > pick this repository and branch.
# All free plans (no card). Database: Supabase free Postgres (paste the session-pooler string as DATABASE_URL). Free services sleep after 15 min idle.
envVarGroups:
  - name: jafson-shared   # same value for the API, shop and back-office
    envVars:
      - { key: INTERNAL_PROXY_SECRET, generateValue: true }
services:
  - type: web
    name: jafson-api
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /v1/health
    envVars:
      - fromGroup: jafson-shared
      - { key: PORT, value: "10000" }
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }  # one proxy (Render) in front of the API
      - { key: PAYMENTS_PROVIDER, value: razorpay }
      - { key: OTP_DEV_ECHO, value: "0" }
      - { key: PAYMENTS_MOCK, value: "0" }
      - { key: REQUIRE_ADMIN_MFA, value: "1" }
      - { key: SEED_CATALOGUE, value: "1" }
      - { key: SELLER_LEGAL_NAME, value: Chameron Industries Private Limited }
      - { key: JWT_SECRET, generateValue: true }
      - { key: MFA_ENCRYPTION_KEY, generateValue: true }
      - { key: BILL_OS_API_KEY, generateValue: true }
      - { key: PAYMENT_WEBHOOK_SECRET, generateValue: true }
      - { key: DATABASE_URL, sync: false }
      - { key: ADMIN_BOOTSTRAP_EMAIL, sync: false }
      - { key: ADMIN_BOOTSTRAP_PASSWORD, generateValue: true }
      - { key: RAZORPAY_KEY_ID, sync: false }
      - { key: RAZORPAY_KEY_SECRET, sync: false }
      - { key: RAZORPAY_WEBHOOK_SECRET, sync: false }
      - { key: SELLER_GSTIN, sync: false }
      - { key: SELLER_CIN, sync: false }
      - { key: SELLER_ADDRESS, sync: false }
  - type: web
    name: jafson-web
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.web
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /
    domains: [jafson.chamerondigital.com]
    envVars:
      - fromGroup: jafson-shared
      - { key: TRUST_CF_HEADER, value: "1" }   # Cloudflare is in front: use CF-Connecting-IP as the visitor address
  - type: web
    name: jafson-admin
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.admin
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /login
    domains: [jafson-admin.chamerondigital.com]
    envVars:
      - fromGroup: jafson-shared
      - { key: TRUST_CF_HEADER, value: "1" }   # Cloudflare is in front: use CF-Connecting-IP as the visitor address
